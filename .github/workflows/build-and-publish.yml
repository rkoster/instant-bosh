name: Build and Publish Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'ops/**'
      - 'manifests/**'
      - 'devbox.lock'
      - 'vendor/**'
      - 'Makefile'
      - 'LICENSE'
      - '.github/workflows/build-and-publish.yml'
  workflow_run:
    workflows: ["Auto Bump Dependencies"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Only run if triggered by push/workflow_dispatch, or if triggered by workflow_run and it was successful
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out bob (BOSH OCI Builder)
        uses: actions/checkout@v4
        with:
          repository: rkoster/bosh-oci-builder
          token: ${{ secrets.GIT_BOB_PULL_SECRET }}
          path: .bob

      - name: Build bob
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C .bob -o pkg/buildkit/bosh-entrypoint ./cmd/entrypoint
          go build -C .bob -o "$RUNNER_TEMP/bob" ./cmd/bob
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build BOSH OCI image with bob
        timeout-minutes: 30
        run: |
          make build

      - name: Tag and push image
        run: |
          # Tag the image with all metadata tags
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "Tagging ghcr.io/rkoster/instant-bosh:latest as $tag"
            docker tag ghcr.io/rkoster/instant-bosh:latest "$tag"
            echo "Pushing $tag"
            docker push "$tag"
          done
