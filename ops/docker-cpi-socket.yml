---
# The instant-bosh Docker client mounts the daemon socket at this path. The
# BOSH VM resource-pool mount in unix-sock.yml is not applied to OCI images.
- type: replace
  path: /instance_groups/name=bosh/properties/docker_cpi/docker/host
  value: unix:///var/run/docker.sock

# Keep the director's BPM worker mount aligned with the CPI configuration.
- type: replace
  path: /instance_groups/name=bosh/properties/director/cpi_additional_volumes
  value:
  - path: /var/run/docker.sock
    writable: true
